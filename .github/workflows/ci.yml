name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

# 同一分支的新运行取消进行中的旧运行，节省 CI 资源。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    env:
      # mock-by-default：CI 不连真实 DB/存储，仅跑静态检查与构建。
      AUTH_MODE: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm vitest run

      - name: Build
        run: pnpm build
